<!doctype html>
<html lang="en">
  <meta charset="UTF-8" />
  <title>LIS result regression checks</title>
  <pre id="result">Running…</pre>
  <script type="module">
    import catalog from '../../src/data/catalog/algorithms.json';
    import { instrumentSource } from '../../src/instrumentation/instrumentSource.ts';
    import { runValidatedFrameCode } from '../../src/runner/runner.ts';
    import { parseTraceFile } from '../../src/features/trace/traceSerialization.ts';
    import { getFrameScene } from '../../src/playback/frameTimeline.ts';
    import { renderArray } from '../../src/visualization/renderArray.ts';

    const starter = catalog.find(
      (entry) => entry.id === 'longest-increasing-subsequence',
    ).code;
    const failures = [];
    for (const [values, length, rename] of [
      [[10, 9, 2, 5, 3, 7, 101, 18], 4, false],
      [[], 0, false],
      [[8], 1, false],
      [[1, 2, 3, 4], 4, false],
      [[5, 4, 3, 2, 1], 1, false],
      [[2, 2, 2], 1, false],
      [[-3, -2, -2, -1], 3, false],
      [[1, 3, 2, 4], 3, false],
      [[3, 4, 1, 2, 8, 5, 6], 4, false],
      [[10, 9, 2, 5, 3, 7, 101, 18], 4, true],
    ]) {
      try {
        let code = starter.replace(
          /const values = \[[^\]]*\];/,
          `const values = ${JSON.stringify(values)};`,
        );
        if (rename) code = code.replace(/\binput\b/g, '__traceLis3');
        const instrumented = instrumentSource(code, 'array');
        if (instrumented === null) throw new Error('Source rejected');
        const result = await runValidatedFrameCode(instrumented, code, 'array');
        if (!result.ok) throw new Error(JSON.stringify(result.error));
        const imported = parseTraceFile(JSON.stringify(result.trace));
        if (!imported.ok) throw new Error(imported.error.message);
        const timeline = imported.timeline;
        const scene = getFrameScene(timeline, timeline.operationCount);
        if (result.trace.frames.at(-1).operation.value !== length)
          throw new Error('Returned LIS length changed');
        if (JSON.stringify(scene.values) !== JSON.stringify(values))
          throw new Error('Input values changed');
        const svg = document.createElementNS(
          'http://www.w3.org/2000/svg',
          'svg',
        );
        renderArray(svg, scene);
        const highlighted = Array.from(
          svg.querySelectorAll(
            '.visualization-array-item.visualization-marked',
          ),
          (node) => node.__data__.index,
        );
        if (highlighted.length !== length)
          throw new Error(
            `Returned length ${length}, but highlighted ${JSON.stringify(highlighted.map((index) => values[index]))}`,
          );
        const indices = scene.markers.best ?? [];
        if (indices.length !== length)
          throw new Error(
            'Best marker does not contain the complete subsequence',
          );
        for (let index = 1; index < indices.length; index++) {
          if (!(
            indices[index - 1] < indices[index] &&
            values[indices[index - 1]] < values[indices[index]]
          ))
            throw new Error(
              'Selected items are not a strictly increasing subsequence',
            );
        }
        if (
          scene.focus.index !== null ||
          Object.keys(scene.focus.pointers).length !== 0
        )
          throw new Error(
            'Last comparison pointers remain active at completion',
          );
        if (getFrameScene(timeline, 0).markers.best !== undefined)
          throw new Error('Result appears before execution');
      } catch (error) {
        failures.push(
          `${JSON.stringify(values)}${rename ? ' (renamed)' : ''}: ${error.message}`,
        );
      }
    }
    document.querySelector('#result').textContent = failures.length
      ? `FAIL\n${failures.join('\n')}`
      : 'PASS: LIS return values, complete subsequences, ties, duplicates, empty inputs and trace replay.';
    document.title = failures.length ? 'FAIL' : 'PASS';
  </script>
</html>
